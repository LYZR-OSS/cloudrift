# Dependency, secret and container scanning on pull requests.
#
# Required secret on this repo (or as an Organization secret):
#   * CS_READ_TOKEN — Fine-grained PAT with `Contents: Read` on
#                     NeuralgoLyzr/code-snake. That repo is private, so the
#                     default GITHUB_TOKEN cannot clone it. Same arrangement as
#                     lyzr-agent #1316 / code-turtle's CT_READ_TOKEN.
#
# Reporting only for now (fail_on_findings: false): the scan comments and
# uploads to the Security tab but never blocks a PR. Flip to true once the
# pre-existing backlog on this branch is triaged.

name: Code Snake

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  security-events: write
  actions: read

jobs:
  scan:
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      actions: read
    uses: NeuralgoLyzr/code-snake/.github/workflows/scan.yml@main
    secrets:
      CS_READ_TOKEN: ${{ secrets.CS_READ_TOKEN }}
    with:
      fail_on_findings: false
      resolve_deps: true
