[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lyzr-cloudrift"
version = "0.5.0"
description = "Cloud-agnostic abstraction for storage, messaging, document databases, cache, secrets, SQL, crypto (KMS), pub/sub, email, and code sandboxes across AWS, Azure, and GCP"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = [
    "cloud", "aws", "azure", "gcp", "s3", "blob", "gcs", "sqs", "servicebus",
    "documentdb", "cosmosdb", "firestore", "redis", "elasticache", "memorystore",
    "cache", "secrets", "keyvault", "secret-manager", "sns", "eventgrid",
    "pubsub", "kms", "email", "ses", "smtp", "sandbox", "code-execution",
    "microvm", "e2b",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
]
dependencies = []

[project.urls]
Homepage      = "https://github.com/LYZR-OSS/cloudrift"
Repository    = "https://github.com/LYZR-OSS/cloudrift"
Issues        = "https://github.com/LYZR-OSS/cloudrift/issues"
Changelog     = "https://github.com/LYZR-OSS/cloudrift/releases"
Documentation = "https://github.com/LYZR-OSS/cloudrift#readme"

[project.optional-dependencies]
aws = [
    "aiobotocore>=3.9.1",     # native async S3 / SQS / SNS / Secrets Manager / SES / KMS / Lambda MicroVMs
    "aiohttp>=3.14.3",        # security floor for aiobotocore transitive (GHSA-mfx4-hv73-q22v, GHSA-cq5v-8q36-5273)
    "motor>=3.3.0",           # async MongoDB driver for DocumentDB
    "pymongo[aws]>=4.6.3",    # sync MongoDB driver + MONGODB-AWS IAM auth (pymongo-auth-aws)
    "redis[hiredis]>=5.0.0",  # ElastiCache (also used by standalone)
]
azure = [
    "azure-storage-blob>=12.19.0",
    "azure-servicebus>=7.11.0",
    "azure-identity>=1.15.0",
    "azure-keyvault-secrets>=4.7.0",
    "azure-keyvault-keys>=4.8.0",   # Key Vault keys crypto (KMS analog)
    "cryptography>=50.0.1",         # AES-GCM data key for envelope encryption
    "azure-eventgrid>=4.9.0",
    "azure-communication-email>=1.0.0",
    "motor>=3.3.0",           # Cosmos DB via MongoDB API
    "pymongo>=4.6.3",         # sync MongoDB driver (optional sync client)
    "redis[hiredis]>=5.0.0",  # Azure Cache for Redis
]
gcp = [
    "google-auth>=2.28.0",                  # shared ADC chain (cloudrift.core.gcp_credentials)
    "gcloud-aio-storage>=9.0.0",            # native async GCS (no first-party async client)
    # Direct import, not just a transitive: storage/gcs.py translates
    # aiohttp.ClientResponseError at the backend boundary. Same security floor as
    # the aws extra (GHSA-mfx4-hv73-q22v, GHSA-cq5v-8q36-5273) — without it a
    # gcp-only install resolves an unpinned, vulnerable aiohttp.
    "aiohttp>=3.14.3",
    "google-cloud-pubsub>=2.20.0",          # async Pub/Sub (messaging + pub/sub categories)
    "google-cloud-secret-manager>=2.18.0",  # async Secret Manager
    "google-cloud-kms>=2.21.0",             # async Cloud KMS
    # Firestore with MongoDB compatibility speaks the Mongo wire protocol.
    # pymongo>=4.7 is the release that added Google Cloud OIDC auth; the
    # SCRAM and connection-string paths work on the 4.6.3 floor.
    "motor>=3.3.0",
    "pymongo>=4.7",
    "redis[hiredis]>=5.0.0",                # Memorystore for Redis / Valkey
]
cache = [
    "redis[hiredis]>=5.0.0",
]
email = [
    "aiosmtplib>=3.0",        # raw SMTP backend
]
sandbox-aws = [
    "aiobotocore>=3.9.1",     # control plane: Lambda MicroVMs (RunMicrovm, tokens, lifecycle)
    "aiohttp>=3.14.3",        # data plane: per-microVM HTTPS exec endpoint
]
sandbox-azure = [
    "azure-identity>=1.15.0", # Entra token for the dynamic-sessions pool
    "aiohttp>=3.14.3",        # data plane: pool management + exec REST calls
]
sandbox-e2b = [
    "e2b>=2.2.0",
]
# SQL connection + auth backends (one extra per engine — install only what you use).
sql-postgres = [
    "psycopg[binary]>=3.1",   # PostgreSQL / Redshift (async); RDS IAM needs boto3
    "psycopg-pool>=3.2",      # opt-in connection pooling (acquire())
]
sql-mysql = [
    "mysql-connector-python>=8.2",  # MySQL / Aurora MySQL (async); RDS IAM needs boto3
]
sql-mssql = [
    "aioodbc>=0.4",           # MS SQL Server / Azure SQL (requires system ODBC Driver 18)
    "cryptography>=50.0.1",   # self-signed certificate pinning (>=50.0.1: GHSA-537c-gmf6-5ccf, GHSA-g6cj-pr64-35w5)
    "azure-identity>=1.15.0", # Azure AD / Entra token auth
]
sql-oracle = [
    "oracledb>=2.0",
]
sql-databricks = [
    "databricks-sql-connector>=3.0",
]
sql = [
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "mysql-connector-python>=8.2",
    "aioodbc>=0.4",
    "cryptography>=50.0.1",
    "azure-identity>=1.15.0",
    "oracledb>=2.0",
    "databricks-sql-connector>=3.0",
]
all = [
    "aiobotocore>=3.9.1",
    "aiohttp>=3.14.3",
    "motor>=3.3.0",
    "pymongo[aws]>=4.7",
    "google-auth>=2.28.0",
    "gcloud-aio-storage>=9.0.0",
    "google-cloud-pubsub>=2.20.0",
    "google-cloud-secret-manager>=2.18.0",
    "google-cloud-kms>=2.21.0",
    "azure-storage-blob>=12.19.0",
    "azure-servicebus>=7.11.0",
    "azure-identity>=1.15.0",
    "azure-keyvault-secrets>=4.7.0",
    "azure-keyvault-keys>=4.8.0",
    "azure-eventgrid>=4.9.0",
    "azure-communication-email>=1.0.0",
    "redis[hiredis]>=5.0.0",
    "aiosmtplib>=3.0",
    "psycopg[binary]>=3.1",
    "mysql-connector-python>=8.2",
    "aioodbc>=0.4",
    "cryptography>=50.0.1",
    "oracledb>=2.0",
    "databricks-sql-connector>=3.0",
    "e2b>=2.2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "moto[s3,sqs,sns,ses,secretsmanager,kms,server]>=5.0",
    "aiobotocore>=3.9.1",
    "motor>=3.3.0",
    "pymongo[aws]>=4.7",
    "google-auth>=2.28.0",
    "gcloud-aio-storage>=9.0.0",
    "google-cloud-pubsub>=2.20.0",
    "google-cloud-secret-manager>=2.18.0",
    "google-cloud-kms>=2.21.0",
    "fakeredis>=2.20.0",
    "httpx>=0.25.0",
    "ruff>=0.4.0",
    "aiosmtplib>=3.0",
    "azure-communication-email>=1.0.0",
    "azure-storage-blob>=12.19.0",
    "azure-identity>=1.15.0",
    "azure-keyvault-keys>=4.8.0",
    "cryptography>=50.0.1",
    "azure-servicebus>=7.11.0",
    "e2b>=2.2.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["cloudrift", "cloudrift_sandbox_server.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "fakeredis>=2.35.1",
]
